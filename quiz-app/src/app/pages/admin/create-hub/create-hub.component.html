<div class="min-h-[80vh]">
  <!-- Hero Banner -->
  <div class="relative bg-gradient-to-b from-pink-100 via-purple-50 to-gray-50 pt-12 pb-16 overflow-hidden">
    <!-- Decorative blobs -->
    <div class="absolute top-0 left-1/4 w-64 h-64 bg-pink-200/40 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-1/4 w-80 h-80 bg-purple-200/30 rounded-full blur-3xl"></div>

    <div class="relative max-w-4xl mx-auto px-4 text-center">
      <p class="text-xl md:text-2xl text-gray-700 mb-10 font-medium">
        Xin chào, <span class="font-bold text-gray-900">{{ userName }}</span> 👋 Hãy bắt đầu nào.
      </p>

      <!-- Tab bar -->
      <div class="inline-flex bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">
        <div class="flex items-center gap-2 px-8 py-4 bg-gradient-to-b from-purple-50 to-white border-b-2 border-primary-500 cursor-pointer">
          <i class="fas fa-pencil-alt text-primary-500"></i>
          <div class="text-left">
            <div class="text-sm font-bold text-primary-600">Tạo mới</div>
            <div class="text-xs text-gray-500">một nguồn lực</div>
          </div>
        </div>
        <div class="flex items-center gap-2 px-8 py-4 text-gray-400 cursor-not-allowed">
          <i class="fas fa-search"></i>
          <div class="text-left">
            <div class="text-sm font-medium">Tìm kiếm</div>
            <div class="text-xs text-gray-400">để có nguồn lực</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Activity Cards -->
  <div class="max-w-4xl mx-auto px-4 -mt-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 py-8">
      @for (item of activities; track item.title) {
        @if (!item.disabled) {
          <a [routerLink]="item.route"
             class="group relative flex flex-col items-center p-8 bg-white rounded-2xl border border-gray-100
                    shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer">
            <!-- Icon -->
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-br {{ item.gradient }} flex items-center justify-center mb-5
                        shadow-lg group-hover:scale-110 transition-transform duration-300">
              <i class="{{ item.icon }} text-white text-3xl"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mb-1">{{ item.title }}</h3>
            <p class="text-sm text-gray-500 text-center leading-relaxed">{{ item.description }}</p>
          </a>
        } @else {
          <div class="group relative flex flex-col items-center p-8 bg-white/60 rounded-2xl border border-gray-100
                      shadow-sm cursor-not-allowed opacity-70">
            <!-- Badge -->
            @if (item.badge) {
              <span class="absolute top-3 right-3 px-2.5 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-full">
                {{ item.badge }}
              </span>
            }
            <!-- Icon -->
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-br {{ item.gradient }} flex items-center justify-center mb-5
                        shadow-lg opacity-50">
              <i class="{{ item.icon }} text-white text-3xl"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-500 mb-1">{{ item.title }}</h3>
            <p class="text-sm text-gray-400 text-center leading-relaxed">{{ item.description }}</p>
          </div>
        }
      }
    </div>
  </div>
</div>
