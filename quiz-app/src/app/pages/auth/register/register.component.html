<div class="min-h-[calc(100vh-200px)] flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-lg">

    <!-- Card -->
    <div class="card p-8">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-gradient-to-br from-accent-500 to-primary-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-accent-500/25">
          <i class="fas fa-user-plus text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Create Account</h1>
        <p class="text-gray-500 text-sm mt-1">Join QuizApp and start learning today</p>
      </div>

      <!-- Error Message -->
      @if (errorMessage) {
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6 flex items-center gap-2">
          <i class="fas fa-exclamation-circle"></i>
          <span class="text-sm">{{ errorMessage }}</span>
        </div>
      }

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">

        <!-- Name Row -->
        <div class="grid grid-cols-2 gap-4 mb-5">
          <div>
            <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1.5">First Name</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-user"></i></span>
              <input type="text" id="firstName" name="firstName" [(ngModel)]="registerDto.firstName"
                     required placeholder="First name"
                     class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg text-sm
                            focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none
                            transition-all duration-200 bg-gray-50 focus:bg-white" />
            </div>
          </div>
          <div>
            <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1.5">Last Name</label>
            <input type="text" id="lastName" name="lastName" [(ngModel)]="registerDto.lastName"
                   required placeholder="Last name"
                   class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm
                          focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none
                          transition-all duration-200 bg-gray-50 focus:bg-white" />
          </div>
        </div>

        <!-- Email -->
        <div class="mb-5">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-envelope"></i></span>
            <input type="email" id="email" name="email" [(ngModel)]="registerDto.email"
                   required email placeholder="you@example.com"
                   class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg text-sm
                          focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none
                          transition-all duration-200 bg-gray-50 focus:bg-white" />
          </div>
        </div>

        <!-- Username -->
        <div class="mb-5">
          <label for="userName" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-at"></i></span>
            <input type="text" id="userName" name="userName" [(ngModel)]="registerDto.userName"
                   required placeholder="Choose a username"
                   class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg text-sm
                          focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none
                          transition-all duration-200 bg-gray-50 focus:bg-white" />
          </div>
        </div>

        <!-- Password -->
        <div class="mb-5">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-lock"></i></span>
            <input [type]="showPassword ? 'text' : 'password'"
                   id="password" name="password" [(ngModel)]="registerDto.password"
                   required minlength="6" placeholder="Min 6 characters"
                   class="w-full pl-10 pr-12 py-3 border border-gray-200 rounded-lg text-sm
                          focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none
                          transition-all duration-200 bg-gray-50 focus:bg-white" />
            <button type="button" (click)="togglePassword()"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
              <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-6">
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-lock"></i></span>
            <input [type]="showPassword ? 'text' : 'password'"
                   id="confirmPassword" name="confirmPassword" [(ngModel)]="registerDto.confirmPassword"
                   required placeholder="Repeat your password"
                   class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg text-sm
                          focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none
                          transition-all duration-200 bg-gray-50 focus:bg-white"
                   [class.border-red-400]="registerDto.confirmPassword && !passwordsMatch"
                   [class.focus:ring-red-500]="registerDto.confirmPassword && !passwordsMatch" />
          </div>
          @if (registerDto.confirmPassword && !passwordsMatch) {
            <p class="text-red-500 text-xs mt-1.5"><i class="fas fa-exclamation-triangle mr-1"></i> Passwords do not match</p>
          }
        </div>

        <!-- Submit -->
        <button type="submit"
                [disabled]="registerForm.invalid || !passwordsMatch || isLoading"
                class="w-full btn-primary py-3 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          @if (isLoading) {
            <i class="fas fa-spinner fa-spin"></i>
            <span>Creating account...</span>
          } @else {
            <i class="fas fa-user-plus"></i>
            <span>Create Account</span>
          }
        </button>
      </form>

      <!-- Footer -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-500">
          Already have an account?
          <a routerLink="/auth/login" class="text-primary-600 font-medium hover:text-primary-700 transition-colors">
            Sign in
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
