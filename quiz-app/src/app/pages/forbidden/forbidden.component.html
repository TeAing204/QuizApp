<div class="min-h-[70vh] flex items-center justify-center animate-fade-in">
  <div class="text-center max-w-md mx-auto px-4">
    <!-- Icon -->
    <div class="w-28 h-28 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
      <i class="fas fa-shield-alt text-5xl text-red-400"></i>
    </div>

    <!-- Error Code -->
    <h1 class="text-7xl font-extrabold bg-gradient-to-r from-red-500 to-orange-500 bg-clip-text text-transparent mb-3">
      403
    </h1>

    <!-- Title -->
    <h2 class="text-2xl font-bold text-gray-900 mb-3">
      Access Denied
    </h2>

    <!-- Description -->
    <p class="text-gray-500 mb-8 leading-relaxed">
      You do not have permission to access this page.
      Please contact the administrator if you believe this is a mistake.
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a routerLink="/"
         class="btn-primary flex items-center justify-center gap-2">
        <i class="fas fa-home"></i> Back to Home
      </a>
      <a routerLink="/auth/login"
         class="btn-secondary flex items-center justify-center gap-2">
        <i class="fas fa-sign-in-alt"></i> Log In Again
      </a>
    </div>
  </div>
</div>
