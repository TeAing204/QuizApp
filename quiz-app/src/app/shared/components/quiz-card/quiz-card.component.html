<div class="card group cursor-pointer">
  <!-- Thumbnail -->
  <div class="relative h-48 bg-gradient-to-br from-primary-400 via-primary-500 to-accent-600 overflow-hidden">
    @if (quiz.thumbnailUrl) {
      <img [src]="getFullThumbnailUrl(quiz.thumbnailUrl!)" [alt]="quiz.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
    } @else {
      <div class="w-full h-full flex items-center justify-center">
        <i class="fas fa-clipboard-list text-white/30 text-6xl group-hover:scale-110 transition-transform duration-500"></i>
      </div>
    }

    <!-- Badge -->
    <div class="absolute top-3 right-3">
      <span class="px-2.5 py-1 rounded-full text-xs font-semibold"
            [class]="quiz.isActive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'">
        {{ quiz.isActive ? 'Active' : 'Inactive' }}
      </span>
    </div>
  </div>

  <!-- Content -->
  <div class="p-5">
    <h3 class="text-lg font-bold text-gray-900 mb-2 group-hover:text-primary-600 transition-colors line-clamp-1">
      {{ quiz.title }}
    </h3>
    <p class="text-gray-500 text-sm mb-4 line-clamp-2 leading-relaxed">
      {{ quiz.description }}
    </p>

    <!-- Meta Info -->
    <div class="flex items-center justify-between pt-4 border-t border-gray-100">
      <div class="flex items-center gap-4">
        <span class="flex items-center gap-1.5 text-sm text-gray-500">
          <i class="fas fa-clock text-primary-500"></i>
          {{ quiz.duration | durationFormat }}
        </span>
        <span class="flex items-center gap-1.5 text-sm text-gray-500">
          <i class="fas fa-question-circle text-accent-500"></i>
          {{ quiz.numberOfQuestions }} questions
        </span>
      </div>
      <button class="text-primary-600 hover:text-primary-700 text-sm font-medium">
        Start <i class="fas fa-arrow-right ml-1"></i>
      </button>
    </div>
  </div>
</div>
